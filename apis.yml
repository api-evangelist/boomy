description: >-
  Boomy is a consumer-facing generative music platform that lets anyone
  create original AI songs in a browser or mobile app and release them to
  Spotify, Apple Music, Amazon Music, TikTok, YouTube, and other DSPs with
  Boomy collecting and paying out streaming royalties. Boomy does not
  publish a public, self-serve developer API; integrations and partner
  arrangements (DSP distribution, licensing) are handled directly by the
  Boomy team rather than through a documented public API surface.
